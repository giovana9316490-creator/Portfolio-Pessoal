
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Meu Portfólio</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .formulario {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(50, 30, 100, 0.08);
        }

        .formulario label {
            display: block;
            margin: 18px 0 6px;
            font-weight: bold;
        }

        .formulario input,
        .formulario textarea,
        .formulario select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d2ec;
            border-radius: 8px;
            font: inherit;
        }

        .formulario textarea {
            min-height: 130px;
            resize: vertical;
        }

        .formulario button {
            margin-top: 22px;
            padding: 13px 24px;
            border: none;
            border-radius: 25px;
            background: #6c4be8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .formulario button:hover {
            background: #382477;
        }

        .aviso {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="quem-sou-eu.html">Quem sou eu</a>
            <a href="portfolio.html">Portfólio</a>
            <a href="contato.html">Contato</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p>VAMOS CONVERSAR</p>
            <h1>Entre em contato</h1>
            <p>Envie uma mensagem pelo formulário abaixo.</p>
        </section>

        <form class="formulario" id="form-contato">
            <h2>Envie sua mensagem</h2>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="seu@email.com" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(00) 00000-0000">

            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto" required>
                <option value="">Selecione um assunto</option>
                <option value="Projetos">Projetos</option>
                <option value="Dúvidas">Dúvidas</option>
                <option value="Parcerias">Parcerias</option>
                <option value="Outro">Outro</option>
            </select>

            <button type="submit">Enviar mensagem</button>

            <p class="aviso" id="mensagem"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Meu Portfólio Escolar</p>
    </footer>

    <script>
        document.getElementById("form-contato")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("mensagem").textContent =
                    "O formulário está pronto visualmente. A conexão com o banco será configurada na próxima etapa.";
            });
    </script>

</body>
</html>
