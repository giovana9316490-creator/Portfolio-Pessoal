<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Giovana Silva</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="site-header">

        <a href="index.html" class="brand">
            G<span>.</span>S
        </a>

        <nav class="nav">

            <a href="index.html">Início</a>

            <a href="quem-sou-eu.html">Quem sou eu</a>

            <a href="portfolio.html">Portfólio</a>

            <a href="contato.html">Contato</a>

        </nav>

        <span class="header-mark">
            ACESSO RESTRITO
        </span>

    </header>


    <main class="container"
        style="min-height:80vh; display:flex; align-items:center;">

        <section style="width:100%; max-width:650px; margin:auto; padding:80px 0;">

            <div class="eyebrow red">
                ÁREA ADMINISTRATIVA
            </div>

            <h1 class="display">

                ACESSO

                <br>

                <span class="outline">
                    RESTRITO.
                </span>

            </h1>

            <p class="body-copy">

                Entre com suas credenciais
                administrativas para acessar
                o painel de gerenciamento.

            </p>

            <br><br>


            <form id="login-form" class="form-grid">

                <div class="field full">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="Seu e-mail">

                </div>


                <div class="field full">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Sua senha">

                </div>


                <div class="field full">

                    <button type="submit" class="btn">
                        ENTRAR NO SISTEMA ↗
                    </button>

                    <div id="login-status"
                        class="notice"
                        aria-live="polite">

                    </div>

                </div>

            </form>

        </section>

    </main>


    <footer class="site-footer">

        <span>© 2026 GIOVANA SILVA</span>

        <a href="index.html">
            VOLTAR AO SITE ↗
        </a>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <script>

        const loginForm = document.getElementById("login-form");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const status = document.getElementById("login-status");

            if (!window.supabaseReady) {

                status.textContent = "Configure a conexão com o Supabase.";

                status.className = "notice error";

                return;

            }

            const email = document.getElementById("email").value;

            const password = document.getElementById("password").value;

            status.textContent = "Verificando acesso...";

            const { data, error } = await window.supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {

                status.textContent = "E-mail ou senha incorretos.";

                status.className = "notice error";

                return;

            }

            window.location.href = "dashboard.html";

        });

    </script>

</body>

</html>
