<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Giovana Silva</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="site-header">

        <a href="index.html" class="brand">
            G<span>.</span>S
        </a>

        <span class="header-mark">
            PAINEL ADMINISTRATIVO
        </span>

        <button id="logout" class="btn secondary">
            SAIR ↗
        </button>

    </header>


    <main class="container">

        <section class="page-hero">

            <div class="eyebrow red">
                ÁREA ADMINISTRATIVA
            </div>

            <h1 class="display">

                DASH

                <br>

                <span class="outline">
                    BOARD.
                </span>

            </h1>

            <p class="body-copy">

                Gerencie os projetos publicados
                no seu portfólio.

            </p>

        </section>


        <div id="admin-status" class="notice">
            Verificando autenticação...
        </div>


        <!-- CADASTRO -->

        <section class="section">

            <div class="eyebrow">
                01 / NOVO PROJETO
            </div>

            <h2 class="section-title">

                CADASTRAR

                <span>PROJETO.</span>

            </h2>

            <br><br>


            <form id="project-form" class="form-grid">

                <div class="field">

                    <label for="nome">
                        Nome do projeto
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        maxlength="120">

                </div>


                <div class="field">

                    <label for="link">
                        Link do projeto
                    </label>

                    <input
                        type="url"
                        id="link"
                        name="link"
                        required
                        placeholder="https://">

                </div>


                <div class="field full">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        required></textarea>

                </div>


                <div class="field full">

                    <label for="foto">
                        URL da imagem
                    </label>

                    <input
                        type="url"
                        id="foto"
                        name="foto"
                        placeholder="https://">

                </div>


                <div class="field full">

                    <button type="submit" class="btn">
                        SALVAR PROJETO ↗
                    </button>

                </div>

            </form>

        </section>


        <!-- LISTAGEM -->

        <section class="section">

            <div class="eyebrow">
                02 / GERENCIAMENTO
            </div>

            <h2 class="section-title">

                MEUS

                <span>PROJETOS.</span>

            </h2>

            <br><br>


            <div style="overflow-x:auto;">

                <table class="admin-table">

                    <thead>

                        <tr>

                            <th>Projeto</th>

                            <th>Link</th>

                            <th>Ação</th>

                        </tr>

                    </thead>

                    <tbody id="project-rows">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <span>© 2026 GIOVANA SILVA</span>

        <a href="index.html">
            VOLTAR AO SITE ↗
        </a>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <script>

        document.addEventListener("DOMContentLoaded", async function() {

            const client = window.supabaseClient;

            const status = document.getElementById("admin-status");

            const rows = document.getElementById("project-rows");

            const form = document.getElementById("project-form");


            if (!window.supabaseReady || !client) {

                status.textContent = "Configure o Supabase antes de acessar.";

                status.className = "notice error";

                return;

            }


            // VERIFICAR AUTENTICAÇÃO

            const { data: { session }, error: sessionError } =
                await client.auth.getSession();

            if (sessionError || !session) {

                window.location.href = "login.html";

                return;

            }


            status.textContent = "Acesso autorizado.";

            status.className = "notice success";


            // CARREGAR PROJETOS

            async function carregarProjetos() {

                const { data, error } = await client
                    .from("projetos")
                    .select("id,nome,link")
                    .order("id", { ascending: true });


                if (error) {

                    status.textContent = "Erro ao carregar: " + error.message;

                    status.className = "notice error";

                    return;

                }


                rows.innerHTML = "";


                data.forEach(projeto => {

                    const tr = document.createElement("tr");

                    const nome = document.createElement("td");

                    nome.textContent = projeto.nome;


                    const linkCell = document.createElement("td");

                    const link = document.createElement("a");

                    link.href = projeto.link;

                    link.target = "_blank";

                    link.rel = "noopener noreferrer";

                    link.textContent = "ABRIR ↗";

                    link.className = "text-link";

                    linkCell.appendChild(link);


                    const action = document.createElement("td");

                    const button = document.createElement("button");

                    button.textContent = "EXCLUIR";

                    button.className = "btn secondary";

                    button.type = "button";


                    button.addEventListener("click", async function() {

                        if (!confirm("Deseja excluir este projeto?")) {
                            return;
                        }

                        const { error } = await client
                            .from("projetos")
                            .delete()
                            .eq("id", projeto.id);


                        if (error) {

                            status.textContent = error.message;

                            status.className = "notice error";

                            return;

                        }

                        carregarProjetos();

                    });


                    action.appendChild(button);

                    tr.append(nome, linkCell, action);

                    rows.appendChild(tr);

                });

            }


            // CADASTRAR PROJETO

            form.addEventListener("submit", async function(event) {

                event.preventDefault();


                const nome = document.getElementById("nome").value;

                const descricao = document.getElementById("descricao").value;

                const link = document.getElementById("link").value;

                const foto = document.getElementById("foto").value;


                const novoProjeto = {

                    nome: nome,

                    "descrição": descricao,

                    link: link,

                    foto: foto || null

                };


                const { error } = await client
                    .from("projetos")
                    .insert([novoProjeto]);


                if (error) {

                    status.textContent = "Erro ao salvar: " + error.message;

                    status.className = "notice error";

                    return;

                }


                status.textContent = "Projeto cadastrado com sucesso!";

                status.className = "notice success";

                form.reset();

                carregarProjetos();

            });


            // SAIR

            document.getElementById("logout")
                .addEventListener("click", async function() {

                    await client.auth.signOut();

                    window.location.href = "login.html";

                });


            carregarProjetos();

        });

    </script>

</body>

</html>
